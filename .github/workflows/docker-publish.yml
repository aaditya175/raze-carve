name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom image tag (e.g., v0.2.0 or test-build)'
        required: false
        default: ''

jobs:
  docker-publish:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Free runner disk space for ISO layer
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lonewolf175/raze-carve
          flavor: |
            latest=auto
          tags: |
            # Pushes to main branch automatically tag and replace :latest and :website
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=website,enable=${{ github.ref == 'refs/heads/main' }}
            # Git version tags (e.g. v0.1.0 -> :v0.1.0 and :0.1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Manual workflow dispatch custom tag if supplied
            type=raw,value=${{ github.event.inputs.custom_tag }},enable=${{ github.event.inputs.custom_tag != '' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Hydrate embedded release ISOs from verified base image
        run: |
          BASE_IMG="lonewolf175/raze-carve@sha256:3b52413988c8115266f19efc0e82d4a978aa9c6679d8f46f6d82bd1f28011a38"
          docker pull "$BASE_IMG"
          mkdir -p website/public/releases
          cid=$(docker create "$BASE_IMG")
          docker cp "$cid:/usr/share/nginx/html/releases/." website/public/releases/
          docker rm "$cid"
          docker rmi "$BASE_IMG"
          ls -lh website/public/releases/
          df -h

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./website
          file: ./website/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
